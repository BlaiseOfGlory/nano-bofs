name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: never

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Disable Git hooks
        run: git config --global core.hooksPath /dev/null

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Sync root dependencies
        run: uv sync --locked --python 3.11

      - name: Run unit tests
        run: .venv/bin/python -m unittest

      - name: Build Python package
        run: uv build

      - name: Smoke test built wheel
        run: |
          python -m venv /tmp/nano-bofs-wheel
          /tmp/nano-bofs-wheel/bin/python -m pip install --no-index --find-links dist nano-bofs
          /tmp/nano-bofs-wheel/bin/nano-bofs list
          /tmp/nano-bofs-wheel/bin/python - <<'PY'
          import nano_bofs.template_catalog as template_catalog

          names = set(template_catalog.discover_templates())
          assert "probe" in names
          assert "ldapsearch" in names
          print(f"loaded {len(names)} templates from installed wheel")
          PY

      - name: Sync Mythic runtime dependencies
        working-directory: Payload_Type/nano_bofs
        run: uv sync --locked --python 3.11

      - name: Smoke test Mythic runtime imports
        working-directory: Payload_Type/nano_bofs
        run: |
          .venv/bin/python - <<'PY'
          import mythic_container
          import nano_bofs.template_catalog as template_catalog

          names = set(template_catalog.discover_templates())
          assert "mythicSmoke" in names
          assert "ldapsearch" in names
          print(f"loaded {len(names)} templates")
          PY

      - name: Build Docker image
        run: docker build --pull=false --tag nano-bofs-ci:${{ github.sha }} --file Payload_Type/nano_bofs/Dockerfile .

      - name: Smoke test Docker image imports
        run: |
          docker run --rm -i --entrypoint python nano-bofs-ci:${{ github.sha }} - <<'PY'
          import mythic_container
          import nano_bofs.template_catalog as template_catalog

          names = set(template_catalog.discover_templates())
          assert "mythicSmoke" in names
          assert "ldapsearch" in names
          print(f"loaded {len(names)} templates")
          PY
